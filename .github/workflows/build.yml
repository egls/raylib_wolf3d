name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ubuntu-24_04:
    # arm64: plain char is unsigned and long/pointers are 64-bit (WOLF-19)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 xvfb xauth \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev

      - name: Toolchain
        run: |
          uname -m
          cc --version | head -1
          cmake --version | head -1

      - name: raylib quarantine
        run: |
          # Only port/id_raylib.c may include raylib.h
          hits=$(grep -rIlE --include='*.[ch]' --include='*.[CH]' '#[[:space:]]*include[[:space:]]*[<"]raylib\.h[">]' WOLFSRC port | grep -v '^port/id_raylib\.c$' || true)
          if [ -n "$hits" ]; then echo "raylib.h included from: $hits"; exit 1; fi

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: |
          cmake --build build 2>&1 | tee build.log
          echo "Game warnings: $(grep -E '/(WOLFSRC|port)/.*warning:' build.log | wc -l)"

      - name: Headless core tests (data test skips without WL1)
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Smoke test (no game data)
        run: |
          # Missing data must be reported, not crash.
          set +e
          ./build/raylib_wolf3d -data "$RUNNER_TEMP/nodata" ; rc=$?
          set -e
          echo "exit code: $rc"
          test "$rc" = 2
          # Empty placeholder files get past the data check, open the window
          # under Xvfb and must be rejected by the VSWAP loader (exit 1).
          mkdir -p "$RUNNER_TEMP/fake"
          for f in AUDIOHED AUDIOT GAMEMAPS MAPHEAD VGADICT VGAGRAPH VGAHEAD VSWAP; do
            : > "$RUNNER_TEMP/fake/$f.WL1"
          done
          set +e
          # (xvfb-run sends the program's stderr to stdout, so capture both)
          xvfb-run -a -s "-screen 0 1024x768x24" \
            ./build/raylib_wolf3d -data "$RUNNER_TEMP/fake" > run.txt 2>&1 ; rc=$?
          set -e
          cat run.txt
          echo "exit code: $rc"
          test "$rc" = 1
          grep -q 'VSWAP: short read' run.txt

  macos-15:
    # Apple Silicon (arm64), AppleClang; plain char is signed on Apple arm64.
    # macos-15 instead of macos-14: GitHub retires the macos-14 image on
    # 2026-11-02 (brownouts underway); keep the 13.0 deployment target below.
    # No game data in CI: core_wl1_data, demo_sync, persist_check and
    # sound_manager skip.
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      RAYLIB_URL: https://github.com/raysan5/raylib/archive/refs/tags/5.5.tar.gz
      RAYLIB_SHA256: aea98ecf5bc5c5e0b789a76de0083a21a70457050ea4cc2aec7566935f5e258e
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: command -v ninja >/dev/null || brew install ninja

      # The same tarball and SHA-256 as the FetchContent fallback in
      # CMakeLists.txt, which still checks the hash and applies
      # cmake/patch_raylib.cmake to the cached copy.
      - name: Cache raylib 5.5 tarball
        id: raylib-cache
        uses: actions/cache@v4
        with:
          path: ~/raylib-cache
          key: raylib-tarball-5.5-${{ env.RAYLIB_SHA256 }}

      - name: Fetch raylib 5.5 tarball
        if: steps.raylib-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/raylib-cache
          curl -fsSL --retry 3 -o ~/raylib-cache/raylib-5.5.tar.gz "$RAYLIB_URL"
          echo "$RAYLIB_SHA256  $HOME/raylib-cache/raylib-5.5.tar.gz" | shasum -a 256 -c -

      - name: Toolchain
        run: |
          uname -m
          sw_vers
          cc --version | head -1
          cmake --version | head -1
          ninja --version

      - name: raylib quarantine
        run: |
          # Only port/id_raylib.c may include raylib.h
          hits=$(grep -rIlE --include='*.[ch]' --include='*.[CH]' '#[[:space:]]*include[[:space:]]*[<"]raylib\.h[">]' WOLFSRC port | grep -v '^port/id_raylib\.c$' || true)
          if [ -n "$hits" ]; then echo "raylib.h included from: $hits"; exit 1; fi

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DWOLF3D_RAYLIB_URL="file://$HOME/raylib-cache/raylib-5.5.tar.gz"

      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
          echo "Game warnings: $(grep -E '/(WOLFSRC|port)/.*warning:' build.log | wc -l)"
          lipo -archs build/raylib_wolf3d | grep -qx arm64

      - name: Core tests (data tests skip without WL1)
        run: ctest --test-dir build --output-on-failure --no-tests=error

  windows:
    # Depends on the Windows port work under WOLF-29 (WOLF-30..34); the
    # raylib quarantine and shell-based smoke tests stay Linux-only.
    strategy:
      fail-fast: false
      matrix:
        toolchain: [mingw, msvc]
    runs-on: windows-latest
    # MSVC support is best effort until the MinGW build is proven.
    continue-on-error: ${{ matrix.toolchain == 'msvc' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW-w64 (MSYS2)
        if: matrix.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python

      - name: Set up MSVC
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and build (MinGW, Ninja)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          cc --version | head -1
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          ctest --test-dir build --output-on-failure --no-tests=error

      - name: Configure and build (MSVC, Ninja)
        if: matrix.toolchain == 'msvc'
        shell: pwsh
        run: |
          cmake --version
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          ctest --test-dir build --output-on-failure --no-tests=error -C RelWithDebInfo

      - name: Smoke test (no game data)
        shell: pwsh
        run: |
          # Missing data must be reported, not crash (exit 2).
          $exe = (Get-ChildItem -Recurse build -Filter raylib_wolf3d.exe | Select-Object -First 1).FullName
          & $exe -data (Join-Path $env:RUNNER_TEMP 'nodata')
          Write-Host "exit code: $LASTEXITCODE"
          # End with an explicit exit: some pwsh versions exit 1 when a -command
          # script ends on a false-condition if, even after a passing check.
          if ($LASTEXITCODE -ne 2) { exit 1 }
          exit 0
